<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" 
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- CSS -->
    <link rel="stylesheet" href="contact.css">
</head>

<body>

<div class="heading">
    <h1>Contact Us</h1>
</div>

<div id="contact_us">
    <div class="contact_form">
        <div class="form">
            <form class="contacts">

                <h2>Contact Form</h2>

                <div class="input-group">
                    <input type="text" placeholder="Your Full Name" required>
                </div>

                <div class="input-group">
                    <input type="email" placeholder="Your Email Address" required>
                </div>

                <div class="input-group">
                    <textarea rows="4" placeholder="Your Message" required></textarea>
                </div>

                <div class="input-group">
                    You Are a Client? <br>
                    <input type="radio" name="client" value="yes"> Yes
                    <input type="radio" name="client" value="no"> No
                </div>

                <button type="submit">Send</button>

            </form>
        </div>
    </div>
  
    <div id="address">
        <div class="add">

            <h2>Our Information</h2>

            <p><i class="fa-solid fa-location-arrow"></i> Gavase, Maharashtra, 416505</p>
            <p><i class="fa-solid fa-envelope"></i> pranjalcake2021@gmail.com</p>
            <p><i class="fa-solid fa-clock"></i> Open 10:00 AM</p>
            <p><i class="fa-solid fa-clock"></i> Closed 7:00 PM</p>
            <p>www.pranjalcakeshop.com</p>

        </div>
    </div>
</div>

</body>
</html>
